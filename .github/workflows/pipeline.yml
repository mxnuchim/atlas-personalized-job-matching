name: Pipeline

# The scheduler (PRD §6): a cron line, not a broker. One run a day for one person
# needs nothing more, and this keeps the schedule outside the app entirely.
#
# Once daily, not twice: the limit is how many roles a person can apply to in a day,
# not how fast postings appear.
#
# This runs the pipeline *directly against the database* rather than calling the
# deployed app. A run is roughly twelve minutes of LLM calls, which no serverless
# function ceiling allows — so the web app serves the UI and the schedule lives here,
# where the limit is six hours.
#
# The hours are UTC — GitHub Actions speaks no other timezone — and are derived from
# RUN_HOURS in src/lib/schedule.ts. `schedule.test.ts` fails if the two drift apart.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      scoreLimit:
        description: "Cap jobs scored this run (blank = stage default)"
        required: false
      draftLimit:
        description: "Cap drafts written this run (blank = stage default)"
        required: false

concurrency:
  # A slow run must never overlap the next scheduled one: the pipeline is idempotent,
  # but two concurrent runs would double the token spend for no extra work.
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Generous: a full ingest plus 50 scorings is ~12 minutes, and a slow provider
    # should not lose the run. The concurrency group stops overlap either way.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run the pipeline
        env:
          # Secrets — set these in Settings → Secrets and variables → Actions.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          # Non-secret config — set as repository *variables*, not secrets, so they
          # are readable in the logs when something looks wrong.
          APP_URL: ${{ vars.APP_URL }}
          NOTIFY_EMAIL_FROM: ${{ vars.NOTIFY_EMAIL_FROM }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
          MODEL_SCORING: ${{ vars.MODEL_SCORING || 'gpt-5-mini' }}
          MODEL_DRAFTING: ${{ vars.MODEL_DRAFTING || 'gpt-5-mini' }}
          DAILY_QUEUE_SIZE: ${{ vars.DAILY_QUEUE_SIZE || '20' }}
          MAX_PER_COMPANY: ${{ vars.MAX_PER_COMPANY || '4' }}
          MAX_POSTING_AGE_DAYS: ${{ vars.MAX_POSTING_AGE_DAYS || '30' }}
          TZ: ${{ vars.TZ || 'UTC' }}
          LOG_LEVEL: info
          SCORE_LIMIT: ${{ inputs.scoreLimit }}
          DRAFT_LIMIT: ${{ inputs.draftLimit }}
        run: npm run pipeline:run
